<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Discover cafes, restaurants, hotels, attractions, and places near you with SpotFinder.">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpotFinder">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SpotFinder - Location Discovery & Place Finder</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E1E2E 0%, #121212 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }

    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #FF6B4A 0%, #E85030 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(255, 107, 74, 0.35);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    .app-icon svg {
      width: 38px;
      height: 38px;
      fill: #FFFFFF;
    }

    .app-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .app-tagline {
      font-size: 14px;
      color: #9E9E9E;
      margin-bottom: 32px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255, 107, 74, 0.18);
      border-top-color: #FF6B4A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #status-hint {
      margin-top: 20px;
      font-size: 12px;
      color: #757575;
      text-align: center;
      max-width: 300px;
      line-height: 1.5;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="app-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    </div>
    <div class="app-name">SpotFinder</div>
    <div class="app-tagline">Location Discovery & Place Finder</div>
    <div class="spinner"></div>
    <div id="status-hint">Starting engine...</div>
  </div>

  <script>
    // Remove loading splash once Flutter renders its view
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 400);
      }
    });

    // Fallback: observe DOM for flutter-view or glass-pane
    const observer = new MutationObserver((mutations, obs) => {
      const fltView = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
      if (fltView) {
        setTimeout(() => {
          const splash = document.getElementById('loading-splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 400);
          }
        }, 300);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Fallback timeout notice for slow networks
    setTimeout(() => {
      const hint = document.getElementById('status-hint');
      if (hint) {
        hint.innerHTML = 'Downloading resources...<br>If this takes too long, please refresh the page.';
      }
    }, 6000);
    // Prevent stale caching by unregistering old workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
